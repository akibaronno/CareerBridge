{% extends 'base.html' %}{% block title %}Skills & Categories{% endblock %}
{% block content %}
<div class="container my-4"><div class="row g-4">
  <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h5>Categories</h5>
    <form method="post" class="d-flex gap-2 mb-3"><input type="hidden" name="kind" value="category"><input name="name" class="form-control" placeholder="New category" required><button class="btn btn-primary">Add</button></form>
    {% for c in categories %}<form class="d-inline" method="post" action="{{ url_for('admin_taxonomy_delete', kind='category', item_id=c.id) }}" onsubmit="return confirm('Delete {{ c.name }}?')">
      <span class="badge text-bg-light border p-2 me-1 mb-2">{{ c.name }} <button class="btn btn-sm p-0 ms-1 text-danger border-0" title="Delete">&times;</button></span></form>{% endfor %}
  </div></div></div>
  <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h5>Skills</h5>
    <form method="post" class="d-flex gap-2 mb-3"><input type="hidden" name="kind" value="skill"><input name="name" class="form-control" placeholder="New skill" required><button class="btn btn-primary">Add</button></form>
    {% for s in skills %}<form class="d-inline" method="post" action="{{ url_for('admin_taxonomy_delete', kind='skill', item_id=s.id) }}" onsubmit="return confirm('Delete {{ s.name }}?')">
      <span class="badge text-bg-light border p-2 me-1 mb-2">{{ s.name }} <button class="btn btn-sm p-0 ms-1 text-danger border-0" title="Delete">&times;</button></span></form>{% endfor %}
  </div></div></div>
</div></div>
{% endblock %}
