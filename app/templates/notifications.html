{% extends 'base.html' %}{% block title %}Notifications{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:800px">
  <div class="d-flex justify-content-between align-items-center mb-3"><h3>Notifications</h3>
    <form method="post" action="{{ url_for('notifications_read_all') }}"><button class="btn btn-sm btn-outline-secondary">Mark all as read</button></form></div>
  <div class="list-group shadow-sm">
    {% for n in items %}<a class="list-group-item list-group-item-action {{ 'fw-semibold bg-primary-subtle' if not n.is_read }}" href="{{ url_for('notification_open', nid=n.id) }}">
      {{ n.message }}<br><small class="text-muted">{{ n.created_at.strftime('%d %b %Y, %H:%M') }}</small></a>
    {% else %}<div class="list-group-item text-muted">You have no notifications.</div>{% endfor %}
  </div></div>
{% endblock %}
