{% extends 'base.html' %}{% block title %}{{ 'Edit job' if editing else 'Post a job' }}{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:860px"><div class="card shadow-sm"><div class="card-body p-4">
  <h4 class="mb-3">{{ 'Edit job' if editing else 'Post a new job' }}</h4>
  <form method="post"><div class="row g-3">
    <div class="col-md-8"><label class="form-label">Job title</label><input name="title" class="form-control" value="{{ job.title or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">Category</label><select name="category_id" class="form-select"><option value="">Select</option>
      {% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if job.category_id == c.id }}>{{ c.name }}</option>{% endfor %}</select></div>
    <div class="col-12"><label class="form-label">Description</label><textarea name="description" rows="5" class="form-control" required>{{ job.description or '' }}</textarea></div>
    <div class="col-12"><label class="form-label">Requirements</label><textarea name="requirements" rows="3" class="form-control">{{ job.requirements or '' }}</textarea></div>
    <div class="col-md-4"><label class="form-label">Location</label><input name="location" class="form-control" value="{{ job.location or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Job type</label><select name="job_type" class="form-select">
      {% for t in JOB_TYPES %}<option {{ 'selected' if job.job_type == t }}>{{ t }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Salary</label><input name="salary" class="form-control" placeholder="e.g. $800 - $1200" value="{{ job.salary or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Experience required (years)</label><input type="number" min="0" name="experience_required" class="form-control" value="{{ job.experience_required or 0 }}"></div>
    <div class="col-md-6"><label class="form-label">Application deadline</label><input type="date" name="deadline" class="form-control" value="{{ job.deadline.isoformat() if job.deadline else '' }}"></div>
    <div class="col-12"><label class="form-label fw-semibold">Required skills (used for matching)</label>
      <div class="row row-cols-2 row-cols-md-4 g-1 border rounded p-2" style="max-height:220px;overflow:auto">
        {% for s in all_skills %}<div class="col"><div class="form-check">
          <input class="form-check-input" type="checkbox" name="skills" value="{{ s.id }}" id="s{{ s.id }}" {{ 'checked' if s in job.skills }}>
          <label class="form-check-label" for="s{{ s.id }}">{{ s.name }}</label></div></div>{% endfor %}
      </div>
      <input name="new_skills" class="form-control mt-2" placeholder="Other skills (comma separated)"></div>
    {% if editing %}<div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="is_active" id="act" {{ 'checked' if job.is_active }}><label class="form-check-label" for="act">Job is active (visible to candidates)</label></div></div>{% endif %}
  </div>
  <div class="mt-4"><button class="btn btn-primary">{{ 'Save changes' if editing else 'Post job' }}</button>
  <a class="btn btn-link" href="{{ url_for('employer_dashboard') }}">Cancel</a></div></form>
</div></div></div>
{% endblock %}
