{% extends 'base.html' %}{% block title %}Login{% endblock %}
{% block content %}
<div class="container" style="max-width:440px"><div class="card shadow-sm mt-4"><div class="card-body p-4">
  <h3 class="mb-3">Login</h3>
  <form method="post">
    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="text-center mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div></div></div>
{% endblock %}
